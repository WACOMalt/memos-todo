  </defs>
  <rect x="48" y="48" width="416" height="416" rx="92" fill="url(#card)" filter="url(#shadow)"/>
  <g stroke="url(#ink)" stroke-linecap="round" fill="none">
    <path d="M136 196 H272" stroke-width="30"/>
    <path d="M300 256 H376" stroke-width="30"/>
    <path d="M268 312 H376" stroke-width="30"/>
    <path d="M150 262 L206 318 L368 176" stroke-width="46" stroke-linejoin="round"/>
